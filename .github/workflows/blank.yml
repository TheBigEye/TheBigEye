name: 📊 README Stats

# Generates the README cards as SVG files inside this repo,
# so the README doesn't depend on any public instance (Vercel).

on:
  schedule:
    - cron: '23 */6 * * *'   # Every 6 hours (minute 23, to avoid clashing with 👻 My Ghost)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/readme-stats.yml'

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

env:
  # If you create a secret named GH_STATS_TOKEN (a PAT with read:user), it is used.
  # Otherwise the default GITHUB_TOKEN is used (public data only).
  STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── User stats ────────────────────────────────────────────────
      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=TheBigEye&layout=compact&show_icons=true&theme=light&bg_color=0000&custom_title=&hide_border=true
          path: assets/readme/stats/stats-light.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=TheBigEye&show_icons=true&bg_color=0000&title_color=cccccc&text_color=a0a0a0&icon_color=aaaaaa&custom_title=&hide_border=true
          path: assets/readme/stats/stats-dark.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      # ── Top languages ─────────────────────────────────────────────
      - name: Top langs (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=TheBigEye&layout=compact&theme=light&bg_color=0000&custom_title=&hide_border=true&langs_count=6
          path: assets/readme/stats/top-langs-light.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Top langs (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=TheBigEye&layout=compact&bg_color=0000&title_color=cccccc&text_color=a0a0a0&icon_color=aaaaaa&custom_title=&hide_border=true&langs_count=6
          path: assets/readme/stats/top-langs-dark.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      # ── Activity graph ────────────────────────────────────────────
      - name: Activity graph (light)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: TheBigEye
          options: bg_color=0000&color=0d0d0d&area_color=3992cb&area=true&line=45b6fe&point=3992cb&hide_title=true&hide_border=true
          output_path: assets/readme/stats/activity-light.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Activity graph (dark)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: TheBigEye
          options: bg_color=0000&color=a0a0a0&area_color=4f4f4f&area=true&line=000000&point=4f4f4f&hide_title=true&hide_border=true
          output_path: assets/readme/stats/activity-dark.svg
          token: ${{ env.STATS_TOKEN }}

      # ── Commit (only if something changed) ────────────────────────
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/stats/*.svg
          if git diff --cached --quiet; then
            echo "📭 No changes in the cards."
            exit 0
          fi
          git commit -m "📊 Update README stats cards"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD
